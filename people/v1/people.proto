syntax = "proto3";

package people.v1;

option java_multiple_files = true;
option java_package = "com.benwanlh.people.v1";


enum Role {
    ACTOR = 0;
    DIRECTOR = 1;
    WRITER = 2;
    CREATOR = 3;
}

message Person {
    int64 id = 1;
    string name = 2;
    repeated Role roles = 3;
    optional string birthDate = 4;
    optional string bio = 5;
    optional string photoUrl = 6;
}


service PeopleService {
    rpc GetPerson(GetPersonRequest) returns (Person);
    rpc CreatePerson(CreatePersonRequest) returns (Person);
    rpc UpdatePerson(UpdatePersonRequest) returns (Person);
    rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse);
    rpc BatchGetPeople(BatchGetPeopleRequest) returns (BatchGetPeopleResponse);
    rpc SearchPeople(SearchPeopleRequest) returns (SearchPeopleResponse);
    rpc DeletePerson(DeletePersonRequest) returns (DeletePersonResponse);
}

message GetPersonRequest {
    int64 id = 1;
}

message CreatePersonRequest {
    string name = 1;
    repeated Role roles = 2;
    optional string birthDate = 3;
    optional string bio = 4;
    optional string photoUrl = 5;
}

message UpdatePersonRequest {
    int64 id = 1;
    string name = 2;
    repeated Role roles = 3;
    string birthDate = 4;
    string bio = 5;
    string photoUrl = 6;
}

message ListPeopleRequest {}

message ListPeopleResponse {
    repeated Person people = 1;
}

message BatchGetPeopleRequest {
    repeated int64 ids = 1;
}

message BatchGetPeopleResponse {
    repeated Person people = 1;
}

message SearchPeopleRequest {
    string name = 1;
}

message SearchPeopleResponse {
    repeated Person people = 1;
}

message DeletePersonRequest {
    int64 id = 1;
}

message DeletePersonResponse {}