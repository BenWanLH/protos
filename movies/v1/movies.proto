syntax = "proto3";

package movies.v1;

option java_multiple_files = true;
option java_package = "com.benwanlh.movies.v1";

service MovieCreditsService {
  rpc DeleteCreditsByPerson(DeleteCreditsByPersonRequest) returns (DeleteCreditsByPersonResponse);
}

message DeleteCreditsByPersonRequest { int64 personId = 1; }
message DeleteCreditsByPersonResponse {}